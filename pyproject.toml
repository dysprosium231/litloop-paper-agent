[project]
name = "litloop"
version = "1.18.0"
description = "LitLoop academic paper agent: search, screening, download (open access, publisher and institutional routes) and Zotero filing, as an MCP server and CLI"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "requests[socks]>=2.31",
    "urllib3>=2.7.0",
    "beautifulsoup4>=4.12",
    "mcp[cli]>=1.12,<3.0",
    "typer>=0.15",
    "uvicorn>=0.34",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pymupdf4llm>=0.0.17",
    "filelock>=3.12",
    # WebVPN's address encoding; fetcher imports it at the top, so every
    # download needs it (2026-10-23: a base install could not download).
    "pycryptodome>=3.20",
    # Finds "long form (SF)" pairs in abstracts for the glossary's suggestions
    # (Schwartz-Hearst; MIT, needs only `regex`).
    "abbreviations>=0.2.5",
]

[project.urls]
Homepage = "https://github.com/dysprosium231/litloop-paper-agent"
Repository = "https://github.com/dysprosium231/litloop-paper-agent"
Issues = "https://github.com/dysprosium231/litloop-paper-agent/issues"
Upstream = "https://github.com/Rimagination/scansci-pdf"

[project.optional-dependencies]
fast = ["lxml>=4.9"]
# vpnsci and instsci are kept so existing `pip install litloop[vpnsci]` commands
# keep working; pycryptodome is a base dependency since 2026-10-23.
vpnsci = ["pycryptodome>=3.20"]
instsci = ["pycryptodome>=3.20"]
cloakbrowser = ["cloakbrowser>=0.5.9"]
camoufox = ["camoufox[geoip]>=0.4.11"]
web = ["fastapi>=0.115", "jinja2>=3.1"]
patchright = ["patchright>=1.61"]
# zotero_push files papers through zotero-mcp; any install of it is found, this
# extra just puts it in the same environment.
zotero = ["zotero-mcp-server>=0.14.1"]
dev = ["pytest>=8.0"]

[project.scripts]
litloop = "litloop.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litloop = ["data/*.json", "data/*.dat", "data/*.gz", "data/*.txt", "_core/*.pyd", "_core/*.so", "templates/*.html"]

[tool.pytest.ini_options]
# Manual network/browser scripts in the repo root (e.g. test_download_pnas.py)
# must not be collected as tests.
testpaths = ["tests"]
