name: Publisher canaries

# Manual only (2026-10-15): GitHub's US runners cannot test the institutional
# channels LitLoop mostly uses, and they see a different network than users in
# China. Run it from the Actions tab, or locally: python scripts/canary.py
on:
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe lenient publisher surfaces
        run: python scripts/canary.py
