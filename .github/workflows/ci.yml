name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vpnsci,fast]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Check release consistency
        run: python scripts/check_release_consistency.py

  base-install:
    # Only the base dependencies, as `pip install litloop` gives them: every
    # module a download goes through must import (the test job installs extras,
    # which hid a missing pycryptodome until 2026-10-23).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import smoke test
        run: python scripts/import_smoke.py

  app:
    # The desktop app: TypeScript types, the UI copy rules (docs/UI_COPY.md) and
    # the Rust shell. Windows, as the app's users are; it needs no extra system
    # libraries there for cargo check.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check and build the UI
        run: npm run build

      - name: UI copy rules
        run: npm run lint:copy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Check the Rust shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
